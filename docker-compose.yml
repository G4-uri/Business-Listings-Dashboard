# Optional: a throwaway MySQL 8 with the schema pre-loaded.   docker compose up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: business_listings
      MYSQL_USER: bl_user
      MYSQL_PASSWORD: bl_pass
    ports: ["3306:3306"]
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
